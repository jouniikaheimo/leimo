model = "gpt-5-codex"
model_reasoning_effort = "medium"
# Important: use top-level key `mcp_servers` (not mcpServers)
[mcp_servers.laravel-boost]
command = "php"
args = ["artisan", "boost:mcp", "--no-interaction"]
transport = "stdio"

# Add specialized guideline for Laravel project
[[guidelines]]
# Relative path to project (because Codex runs from root project)
path = ".codex/guidelines.md"
